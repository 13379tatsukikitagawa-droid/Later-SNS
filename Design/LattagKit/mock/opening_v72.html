:root{--lime:#C8F25A;--ink:#0B0C0D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#1a1b1e;color:#fff;font-family:-apple-system,"Noto Sans CJK JP",sans-serif;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px}
#ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#ctl button{height:40px;padding:0 16px;border:0;border-radius:20px;background:#2c2d31;color:#fff;font:700 14px -apple-system,"Noto Sans CJK JP",sans-serif}
#ctl button.on{background:var(--lime);color:#111}
.ph{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#000;box-shadow:0 0 0 10px #000,0 0 0 11px #333,0 40px 80px -20px #000;flex:none}
.home{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op{position:absolute;inset:0;overflow:hidden}
.op.A{background:#C8F25A}
.op.B{background:var(--ink)}
/* 地の 色 4案(B)*/
.op .gw{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:0}
.op.B[data-bg="K"]{background:#0B0C0D}
.op.B[data-bg="G"]{background:#0F2A16}
.op.B[data-bg="L"]{background:#C8F25A}
.op.B[data-bg="L"] .tx{color:var(--ink)} .op.B[data-bg="L"] .t9{color:#1F8A35}
.op.B[data-bg="L"] .mk svg{box-shadow:0 0 0 3px #0B0C0D,0 22px 40px -14px rgba(0,0,0,.4)}
.op.B[data-bg="H"]{background:#0B0C0D}
.op.B[data-bg="H"] .gw{background:radial-gradient(130% 55% at 50% 108%,rgba(36,160,60,.62),rgba(36,160,60,.18) 45%,rgba(36,160,60,0) 70%),radial-gradient(55% 32% at 50% 48%,rgba(200,242,90,.10),rgba(200,242,90,0) 70%)}

.mk{position:absolute;left:0;top:0;transform-origin:50% 50%;z-index:2}
.mk svg{width:100%;height:100%;display:block}
.op.B .mk svg{border-radius:22.4%;box-shadow:0 18px 40px -16px rgba(200,242,90,.45)}
.tx{position:absolute;top:0;display:flex;align-items:center;font:900 54px/1 Inter,sans-serif;letter-spacing:-.06em;white-space:nowrap;z-index:1}
.op.A .tx{color:var(--ink)} .op.B .tx{color:#fff}
.tx span{display:inline-block}
.tx .t9{align-self:flex-start;margin:19px 0 0 5px;font:900 15px/1 Inter,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transform-origin:0 100%}
.op.A .t9{color:#1F8A35}.op.B .t9{color:var(--lime)}
.tg{position:absolute;left:0;right:0;text-align:center;font:900 11px Inter,sans-serif;letter-spacing:.32em;opacity:0}
.op.A .tg{color:rgba(11,12,13,.62)} .op.B .tg{color:rgba(255,255,255,.55)}
.tg b{color:#24A03C} .op.B .tg b{color:var(--lime)}
.fl{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#fff 30%,rgba(200,242,90,.7) 62%,rgba(200,242,90,0));opacity:0;pointer-events:none;z-index:3}
.hp{position:absolute;left:50%;bottom:44px;translate:-50% 0;padding:6px 12px;border-radius:12px;background:rgba(0,0,0,.72);color:#fff;font:700 12px -apple-system,sans-serif;opacity:0;z-index:9}
.note{max-width:640px;color:#aab;font-size:13px;line-height:1.7;text-align:center}
@media (max-width:430px){.ph{transform:scale(.86);transform-origin:top center;margin-bottom:-118px}}

const $=id=>document.getElementById(id);let V='B',BG='H',SL=1,timers=[];

function an(el,k,o){return el.animate(k,Object.assign({fill:'both'},o,{duration:o.duration*SL,delay:(o.delay||0)*SL}))}
