h1{font:400 58px/1 var(--ttl)}h1 em{font-style:italic;color:var(--lime)}
.lede{margin-top:10px;font:600 14px/1.7 var(--sans);color:var(--sub);max-width:900px}.lede b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:30px;margin-top:34px}
.card{padding:22px;border-radius:30px;background:#111113;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.card h2{display:flex;align-items:baseline;gap:10px;font:900 20px var(--sans)}.card h2 small{font:700 10px var(--mono);letter-spacing:.18em;color:var(--lime)}.card h2 .rec{margin-left:auto;padding:4px 9px;border-radius:9px;background:var(--lime);color:#111;font:900 10px var(--sans)}
.card p{margin-top:6px;font:600 12.5px/1.65 var(--sans);color:var(--sub)}.card p b{color:#fff}
.stage{position:relative;margin-top:16px;padding:16px 14px;border-radius:24px;background:center/cover;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25)}
.isl{position:relative;display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border-radius:18px;background:#1A1A1E;flex-wrap:wrap}
.isl .lab{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);width:100%}
/* ライブ アクティビティの 共通(362 × 最大 160)*/
.la{position:relative;width:362px;height:160px;border-radius:24px;overflow:hidden;color:#fff;background:rgba(8,8,9,.9);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ap{display:inline-block;position:relative;width:22px;height:22px;border-radius:5px;background:var(--lime);overflow:hidden;flex:none}
.icn{position:absolute;inset:0}.icn i{position:absolute;background:#0B0C0D;border-radius:999px}.icn .a{left:19%;right:19%;top:31%;height:10%}.icn .b{left:19%;right:19%;top:59%;height:10%}.icn .c{top:19%;bottom:19%;left:31%;width:10%}.icn .d{top:19%;bottom:19%;left:59%;width:10%}
.icn u{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:var(--lime);box-shadow:inset 0 0 0 1.5px #0B0C0D;display:block}.icn u::after{content:"";position:absolute;inset:22%;border-radius:50%;background:#10141c}
.hdr{display:flex;align-items:center;gap:7px;font:800 12px var(--sans)}.hdr .lv{display:flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:10px;background:rgba(200,242,90,.12);color:var(--lime);font:700 8.5px var(--mono);letter-spacing:.18em}.hdr .lv i{width:5px;height:5px;border-radius:50%;background:var(--lime)}
.hdr .r{margin-left:auto;font:700 9px var(--mono);color:var(--dim);letter-spacing:.08em}
/* ===== A フィルム ===== */
.fa{padding:12px 14px}
.fa .strip{position:absolute;left:0;right:0;bottom:12px;height:78px;background:#16130F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.fa .strip::before,.fa .strip::after{content:"";position:absolute;left:6px;right:6px;height:6px;background:repeating-linear-gradient(90deg,#060606 0 7px,transparent 7px 13px)}
.fa .strip::before{top:4px}.fa .strip::after{bottom:4px}
.fa .fr{position:absolute;top:13px;width:64px;height:52px;border-radius:2px;background:center/cover;overflow:hidden}
.fa .fr::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(236,240,232,.85),rgba(210,222,208,.7))}
.fa .fr b{position:absolute;left:4px;bottom:3px;z-index:2;font:700 7px var(--mono);color:#E0481A}
.fa .fr em{position:absolute;right:4px;top:3px;z-index:2;font:700 7px var(--mono);font-style:normal;color:#5f6a55}
.fa .fr.e{background:none;box-shadow:inset 0 0 0 1.5px rgba(200,242,90,.7);display:grid;place-items:center;font:800 10px var(--sans);color:var(--lime)}
.fa .fr.e::after{display:none}
.fa .fr.e span{display:flex;flex-direction:column;align-items:center;gap:1px}.fa .fr.e span i{font:400 18px/1 var(--sans);font-style:normal}
.fa .tm{position:absolute;right:14px;top:30px;text-align:right}
.fa .tm small{display:block;font:700 9px var(--mono);letter-spacing:.16em;color:var(--sub)}
.fa .tm b{font:700 34px/1 var(--mono);color:var(--org);letter-spacing:.02em;text-shadow:0 0 10px rgba(255,122,47,.6),0 0 2px rgba(255,190,140,.8)}
.fa .lead{position:absolute;left:14px;top:34px;font:800 15px/1.25 var(--sans)}.fa .lead span{color:var(--lime)}
/* ===== B レンズ ===== */
.fb{display:flex;align-items:center;gap:16px;padding:14px 16px}
.fb .lens{position:relative;width:118px;height:118px;flex:none}
.fb .lens svg{position:absolute;inset:0;width:118px;height:118px}
.fb .lens .core{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E8FF9A,var(--lime) 50%,#8FB22E);box-shadow:0 0 0 3px #0B0B0C,0 0 18px rgba(200,242,90,.6);display:grid;place-items:center;color:#0B0B0C}
.fb .lens .core b{font:900 24px/1 var(--sans)}.fb .lens .core small{position:absolute;bottom:7px;font:800 6.5px var(--sans)}
.fb .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.fb .tx small{font:700 9px var(--mono);letter-spacing:.16em;color:var(--lime)}
.fb .tx b{font:900 40px/1 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}.fb .tx b span{font-size:18px;color:var(--lime);letter-spacing:-.02em;margin-left:4px}
.fb .tx em{font:700 11px var(--sans);font-style:normal;color:#C9C9CF}
.fb .tx .go{margin-top:8px;align-self:flex-start;height:32px;padding:0 14px 0 10px;border-radius:16px;background:var(--lime);color:#111;display:flex;align-items:center;gap:6px;font:900 12.5px var(--sans)}
.fb .tx .go svg{width:15px;height:15px;fill:none;stroke:#111;stroke-width:2.2}
/* ===== C チェキ ===== */
.fc{padding:12px 14px}
.fc .ck{position:absolute;width:62px;padding:4px 4px 15px;background:var(--paper);border-radius:2px;box-shadow:0 8px 16px rgba(0,0,0,.6)}
.fc .ck i{display:block;height:64px;background:center/cover;position:relative}
.fc .ck i::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(238,242,234,.88),rgba(214,224,212,.72))}
.fc .ck s{position:absolute;right:4px;bottom:3px;font:700 6px var(--mono);color:#E0481A;text-decoration:none}
.fc .ck.e{background:rgba(200,242,90,.08);box-shadow:inset 0 0 0 1.5px var(--lime),0 8px 16px rgba(0,0,0,.6)}
.fc .ck.e i{background:none;display:grid;place-items:center;color:var(--lime);font:400 26px var(--sans);font-style:normal}.fc .ck.e i::after{display:none}
.fc .ck.e s{color:var(--lime);font-weight:700}
.fc .k1{left:14px;top:40px;transform:rotate(-8deg)}.fc .k2{left:62px;top:34px;transform:rotate(3deg)}.fc .k3{left:112px;top:42px;transform:rotate(9deg);z-index:2}
.fc .tx{position:absolute;right:14px;top:36px;width:170px;text-align:right}
.fc .tx small{font:700 9px var(--mono);letter-spacing:.16em;color:var(--sub)}
.fc .tx b{display:block;font:900 40px/1 var(--sans);letter-spacing:-.05em}.fc .tx b span{font-size:17px;color:var(--lime)}
.fc .tx em{display:block;margin-top:4px;font:800 11.5px var(--sans);font-style:normal}
.fc .fs{position:absolute;right:14px;bottom:12px;display:flex;align-items:center;gap:6px;font:700 10.5px var(--sans);color:#C9C9CF}
.fc .fs span{display:flex}.fc .fs span i{width:18px;height:18px;border-radius:50%;margin-left:-5px;box-shadow:0 0 0 1.5px #0B0B0C;background:center/cover}
/* ===== D ラストコール(ライム)===== */
.fd{background:var(--lime);color:#0B0B0C;padding:12px 14px}
.fd .band i{position:absolute;background:rgba(11,11,12,.07)}.fd .band .v{top:0;bottom:0;width:26px}.fd .band .h{left:0;right:0;height:22px}
.fd .hdr .lv{background:#0B0B0C;color:var(--lime)}.fd .hdr .lv i{background:var(--lime)}.fd .hdr .r{color:rgba(11,11,12,.55)}
.fd .ap{background:#0B0B0C}.fd .ap .icn i{background:var(--lime)}.fd .ap .icn u{background:#0B0B0C;box-shadow:inset 0 0 0 1.5px var(--lime)}
.fd .big{position:relative;margin-top:6px;font:900 64px/1 var(--sans);letter-spacing:-.06em;font-variant-numeric:tabular-nums}.fd .big span{font-size:24px;letter-spacing:-.02em;opacity:.5}
.fd .sub{position:relative;font:900 13px var(--sans)}
.fd .go{position:absolute;right:14px;bottom:14px;width:74px;height:74px;border-radius:18px;background:#0B0B0C;display:grid;place-items:center;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.fd .go .ap{width:46px;height:46px;border-radius:11px;background:var(--lime)}.fd .go .ap .icn i{background:#0B0C0D}.fd .go .ap .icn u{background:var(--lime);box-shadow:inset 0 0 0 1.5px #0B0C0D}
.fd .go small{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font:900 9px/1 var(--sans);color:var(--lime);transform:translateY(-6px)}
/* ===== E 朝の 部 ===== */
.fe{padding:12px 14px;background:linear-gradient(180deg,rgba(8,8,9,.92),rgba(20,24,10,.92))}
.fe .sun{position:absolute;left:50%;bottom:-130px;width:300px;height:200px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(200,242,90,.55),rgba(200,242,90,.08) 45%,transparent 65%)}
.fe .hz{position:absolute;left:0;right:0;bottom:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(200,242,90,.6),transparent)}
.fe .row{position:relative;display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
.fe .row small{display:block;font:700 9px var(--mono);letter-spacing:.16em;color:var(--lime)}
.fe .row b{font:900 42px/1 var(--sans);letter-spacing:-.05em}.fe .row b span{font-size:17px;color:var(--lime)}
.fe .avs{display:flex}.fe .avs i{width:32px;height:32px;border-radius:50%;margin-left:-8px;background:center/cover;filter:blur(2.5px) saturate(.6);box-shadow:0 0 0 2px #0B0B0C}
.fe .ft{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;align-items:center;font:800 11.5px var(--sans)}
.fe .ft em{font:700 9px var(--mono);font-style:normal;color:var(--sub);letter-spacing:.1em}
/* 共通の 進みの 線(ProgressView(timerInterval:))*/
.pg{position:absolute;left:14px;right:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}.pg i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,rgba(200,242,90,.25),var(--lime))}
/* Dynamic Island */
.dic{position:relative;height:36px;border-radius:20px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 7px;gap:10px}
.dic b{font:800 14px var(--sans);color:var(--lime);font-variant-numeric:tabular-nums}.dic b.o{color:var(--org);font-family:var(--mono);font-weight:700}
.rg{position:relative;width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--lime) var(--p),#2A2A2E 0);display:grid;place-items:center}.rg::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#000}.rg span{position:relative;z-index:1;font:900 10px var(--sans);color:var(--lime)}
.dmin{width:36px;height:36px;border-radius:50%;background:#000;display:grid;place-items:center}
.tbl{width:100%;margin-top:16px;border-collapse:collapse;font:600 12.5px/1.6 var(--sans);color:#C9C9CF}.tbl th,.tbl td{border-bottom:1px solid #222226;padding:8px 12px 8px 0;text-align:left;vertical-align:top}.tbl th{font:700 10px var(--mono);letter-spacing:.14em;color:var(--lime)}
.sec{margin-top:46px}.sec h2{font:800 22px var(--sans)}.sec h2 small{margin-left:10px;font:700 11px var(--mono);letter-spacing:.18em;color:var(--lime)}
</style></head><body>
