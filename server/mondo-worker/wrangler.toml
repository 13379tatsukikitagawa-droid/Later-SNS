# Mondo の審査・集計・削除(Cloudflare Workers 無料プラン)
name = "later-mondo"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 30分ごと:新しい公開写真の画像審査 → 昨日の MondoDay を作りなおす → 48時間を過ぎた分を削除
[triggers]
crons = ["*/30 * * * *"]

# 画像審査(Workers AI。無料枠:1日 10,000 neurons)
[ai]
binding = "AI"

# 審査結果・ことばの辞書(KV。無料枠)。id は `wrangler kv namespace create MONDO` の結果に差しかえる
[[kv_namespaces]]
binding = "MONDO"
id = "9b9db110d16b47f08524d8d9061e5771"

[vars]
CLOUDKIT_CONTAINER = "iCloud.jp.shotoku.later"
# 開発中は development。App Store に出すときは production
CLOUDKIT_ENVIRONMENT = "development"
# 見る環境:Xcode から入れたアプリ = development、TestFlight・App Store = production
CLOUDKIT_ENVIRONMENTS = "development,production"
# 同じ写真への報告がこの数に達したら、自動で保留(Mondo に出さない)
REPORT_THRESHOLD = "2"
# 公開から削除までの時間
RETENTION_HOURS = "48"
# CLOUDKIT_KEY_ID と CLOUDKIT_PRIVATE_KEY(PKCS#8 PEM)は `wrangler secret put` で入れる(ここに書かない)
